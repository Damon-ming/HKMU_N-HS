# app-server/com/damon/ming/ai/embedding-config.yaml
embedding:
  # 主用：Ollama nomic-embed-text
  default:
    provider: ollama
    model_name: bge-m3
    base_url: http://127.0.0.1:11434
    timeout: 60
  
  # 备用：Ollama bge-m3
  backup:
    provider: ollama
    model_name: nomic-embed-text
    base_url: http://127.0.0.1:11434
  
