# app-server/src/com/damon/ming/ai/inference/inference-config.yaml
inference:
  # 开发环境本地Ollama
  default:
    provider: ollama
    base_url: http://ollama-server:11434
    timeout: 60
    max_retries: 3
    temperature: 0.1
    top_p: 0.9
    num_ctx: 4096
    # 新增：主问答模型、摘要模型
    llm_model: qwen2.5:7b-instruct

  # 生产环境 VLLM OpenAI兼容接口
  production:
    provider: vllm
    base_url: http://ollama-server:8000
    api_key: dummy
    timeout: 90
    max_retries: 3
    temperature: 0.1
    top_p: 0.9
    num_ctx: 4096
    llm_model: qwen2.5:7b-instruct